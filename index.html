<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>RaRo Turismo — Vouchers</title>
<style>

*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:#F5F3EC;color:#1E2A22}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.two{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:920px){.two{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid #E4E0D4;border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #C9A84C;background:#1A3A2A;color:#E4D29A}
.btn[disabled]{background:#B9C2BB;border-color:#B9C2BB;color:#eee;cursor:not-allowed}
.ghost{background:#fff;border:1px solid #E4E0D4;color:#1A3A2A;padding:7px 12px;border-radius:8px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.in{width:100%;border:1px solid #E4E0D4;border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:#1E2A22;font-family:inherit}
textarea.in{min-height:58px;resize:vertical}
label.f{display:block}
label.f>span{font-size:12px;color:#6B7A70;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tab{display:flex;align-items:center;gap:7px;padding:12px 16px;border:none;background:transparent;cursor:pointer;font-size:14px;white-space:nowrap;border-top-left-radius:8px;border-top-right-radius:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:20px}
h3.st{font-size:15px;font-weight:700;color:#1A3A2A;margin:0}
.mut{color:#6B7A70}
button.icn{background:none;border:none;cursor:pointer;padding:2px;font-size:15px}



/* ── responsivo (celular/tablet) ── */
.wrap{max-width:1040px}
@media(max-width:920px){ .two{grid-template-columns:1fr} }
@media(max-width:700px){
  .wrap{padding:0 10px}
  .card{padding:14px;margin-bottom:12px}
  h3.st{font-size:14px}
  .in{font-size:16px}                 /* evita zoom no iOS ao focar */
  .g3{grid-template-columns:1fr 1fr;gap:8px}
  /* cabeçalho mais compacto */
  header .row{padding:10px 0 !important}
  header img{height:34px !important}
  header .row div div:first-child{font-size:13px !important;letter-spacing:2px !important}
  /* abas: rolagem horizontal suave + compactas */
  header nav, header .row + div{ -webkit-overflow-scrolling:touch; }
  .tab{padding:10px 12px;font-size:14px;flex:0 0 auto}
}
@media(max-width:440px){
  .g2,.g3{grid-template-columns:1fr}
  .tab{padding:9px 10px;font-size:13px}
}
</style>
</head>
<body>
<div id="root"><div style="padding:24px;color:#6B7A70;font:14px sans-serif">Carregando…</div></div>
<script>
window.addEventListener("error",function(e){var r=document.getElementById("root");if(r&&!r.getAttribute("data-ok")){r.innerHTML='<pre style="padding:16px;color:#9A3B22;white-space:pre-wrap;font:13px monospace">Erro: '+((e.error&&e.error.stack)||e.message)+'</pre>';}});
</script>

const num = v => {
  if (v === "" || v == null) return 0;
  if (typeof v === "number") return v;
  let str = String(v).trim();
  if (str.indexOf(",") > -1) str = str.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(str);
